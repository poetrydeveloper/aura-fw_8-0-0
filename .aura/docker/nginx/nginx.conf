events { worker_connections 1024; }

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    server {
        listen 80;
        server_name localhost;

        # Проксирование трафика к Express API Ткача
        location /api/ {
            proxy_pass http://weaver_backend:5000/;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection 'upgrade';
            proxy_set_header Host $host;
            proxy_cache_bypass $http_upgrade;
            client_max_body_size 50m;
        }

        # Заглушка для корневого URL шлюза
        location / {
            return 200 'AURA_7 API Gateway. Use http://localhost:7788/api/sync-shell for transport, and http://localhost:3001 for Memgraph Lab.\n';
            add_header Content-Type text/plain;
        }
    }
}