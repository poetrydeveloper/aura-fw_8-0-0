events { worker_connections 1024; }

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    server {
        listen 80;
        server_name localhost;

        # 🪐 1. Главная страница и весь роутинг легковесного React-фронтенда Aura Map
        location / {
            proxy_pass http://frontend:3000;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection 'upgrade';
            proxy_set_header Host $host;
            proxy_cache_bypass $http_upgrade;
        }

        # 🗂️ 2. API-шлюз отдачи карты живых стежков для React-фронтенда
        location /api/map {
            alias /app/.aura/services/core/dist/map_project.json;
            add_header Content-Type application/json;
            add_header Access-Control-Allow-Origin *;
        }

        # ⚡ 3. ТВОЙ ОРИГИНАЛЬНЫЙ ШЛЮЗ: Проксирование трафика к Express API Ткача (СТРОГО ПОРТ 5000)
        location /api/ {
            proxy_pass http://weaver_backend:5000/;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection 'upgrade';
            proxy_set_header Host $host;
            proxy_cache_bypass $http_upgrade;
            client_max_body_size 50m;
        }
    }
}
