name: aura-7

services:
  # 1. Графовая СУБД Memgraph (Чистый, стабильный запуск без капризных флагов)
  memgraph:
    image: memgraph/memgraph-mage:latest
    container_name: aura7_memgraph
    expose:
      - "7687"
    volumes:
      - aura7_mg_data:/var/lib/memgraph
    networks:
      - aura7_network

  # 2. Веб-интерфейс Memgraph Lab (Безопасный внешний порт)
  memgraph_lab:
    image: memgraph/lab:latest
    container_name: aura7_memgraph_lab
    ports:
      - "47701:3000"
    depends_on:
      - memgraph
    networks:
      - aura7_network

  # 🚀 ЛЕГКОВЕСНЫЙ REACT-ФРОНТЕНД ВИЗУАЛИЗАЦИИ ДЕРЕВА ПРОЕКТА v39.0
  frontend:
    image: node:20-alpine
    container_name: aura7_frontend
    working_dir: /app/.aura/services/frontend # <=== ЖЕСТКИЙ УКАЗАТЕЛЬ КОРНЯ ДЛЯ VITE
    expose:
      - "3000"
    volumes:
      - ../../:/app
      - /app/.aura/services/frontend/node_modules
    networks:
      - aura7_network
    depends_on:
      - memgraph
    command: sh -c "echo '=== АКТИВАЦИЯ КОНТУРА ФРОНТЕНДА AURA_MAP ===' && npm install && npm run dev -- --host"
  # 3. Модульное ядро Ткача (Порт 5000 полностью скрыт от Windows сокетов)
  weaver_backend:
    image: node:20-alpine
    container_name: aura7_weaver_backend
    working_dir: /app
    expose:
      - "5000"
    volumes:
      - ../../:/app
      - /app/.aura/services/core/node_modules
    networks:
      - aura7_network
    depends_on:
      - memgraph
    command: sh -c "echo '=== АКТИВАЦИЯ КОНТУРА AURA_7 БЕЗ КЭША ===' && ls -la /app && cd /app/.aura/services/core && npm install && rm -rf dist && npx ts-node src/index.ts"

  # 4. Шлюз Nginx (Внешний шлюз на безопасном порту 47788)
  nginx:
    image: nginx:alpine
    container_name: aura7_nginx_gateway
    ports:
      - "47788:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ../../:/app # <=== СНАЙПЕРСКИЙ ПРОБРОС КОРНЯ ПРОЕКТА ДЛЯ API /MAP
    networks:
      - aura7_network
    depends_on:
      - weaver_backend
      - frontend

  # 🚀 5. АВТО-ОПОВЕЩАТЕЛЬ ГОТОВНОСТИ КОНТУРА (Добавлен контроль фронтенда)
  readiness_checker:
    image: alpine:latest
    container_name: aura7_readiness_checker
    networks:
      - aura7_network
    depends_on:
      - memgraph
      - nginx
      - frontend
    command: >
      sh -c "
        echo '⏳ Ожидание полной initialization сетевых портов, базы данных и фронтенда...';
        while ! mknod /tmp/pipe p 2>/dev/null; do sleep 0.5; done;
        until nc -w 1 memgraph 7687 2>/dev/null; do sleep 1; done;
        until nc -w 1 frontend 3000 2>/dev/null; do sleep 1; done;
        until nc -w 1 nginx 80 2>/dev/null; do sleep 1; done;
        echo '=========================================================';
        echo '🔥 [AURA_7 SYSTEM CHECK] ВСЕ КОНТЕЙНЕРЫ И БАЗА УСПЕШНО ПОДНЯТЫ!';
        echo '🚀 КОНТУР ГОТОВ К ПРИЕМУ ПАКЕТОВ ДНК. МОЖНО ЗАПУСКАТЬ ТРАНСПОРТ!';
        echo '=========================================================';
      "

volumes:
  aura7_mg_data:

networks:
  aura7_network:
    driver: bridge
