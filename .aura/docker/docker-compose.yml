name: aura-7

services:
  # 1. Графовая СУБД Memgraph (Глушим логи до уровня WARNING)
  memgraph:
    image: memgraph/memgraph-mage:latest
    container_name: aura7_memgraph
    expose:
      - "7687"
    volumes:
      - aura7_mg_data:/var/lib/memgraph
    command: ["--log-level=WARNING"]
    networks:
      - aura7_network

  # 2. Веб-интерфейс Memgraph Lab (Глушим предупреждения)
  memgraph_lab:
    image: memgraph/lab:latest
    container_name: aura7_memgraph_lab
    ports:
      - "47701:3000"
    environment:
      - LOG_LEVEL=error
    depends_on:
      - memgraph
    networks:
      - aura7_network

  # 🚀 3. ЯДРО ТКАЧА (ГЛАВНЫЙ КОНТЕЙНЕР — УПРАВЛЯЕТ ОЧЕРЕДЬЮ СБОРКИ)
  weaver_backend:
    image: node:20-alpine
    container_name: aura7_weaver_backend
    working_dir: /app/.aura/services/core
    expose:
      - "5000"
    volumes:
      - ../../:/app
      - /app/.aura/services/core/node_modules
    networks:
      - aura7_network
    depends_on:
      - memgraph
    command: >
      sh -c "
        echo '🔍 [Scan Weaver] Проверка целостности зависимостей...';
        if [ ! -d node_modules/express ]; then
          echo '🚨 ПАКЕТЫ ТКАЧА ПОВРЕЖДЕНЫ ИЛИ ОТСУТСТВУЮТ! Восстановление контура...';
          npm install --prefer-offline --no-audit --no-fund;
        fi;
        rm -rf dist && npx ts-node --transpile-only src/index.ts
      "
    # Элегантно тушим гонку: этот блок гарантирует, что бэкенд завершит npm install до старта фронтенда
    healthcheck:
      test: ["CMD", "sh", "-c", "nc -z localhost 5000"]
      interval: 3s
      timeout: 2s
      retries: 30
      start_period: 5s
  # 🚀 4. REACT-ФРОНТЕНД (ЖДЕТ СТАБИЛИЗАЦИИ БЭКЕНДА)
  frontend:
    image: node:20-alpine
    container_name: aura7_frontend
    working_dir: /app/.aura/services/frontend
    expose:
      - "3000"
    volumes:
      - ../../:/app
      - /app/.aura/services/frontend/node_modules
    networks:
      - aura7_network
    depends_on:
      memgraph:
        condition: service_started
      weaver_backend:
        condition: service_healthy # Намертво блокирует старт, пока бэкенд занят npm install
    command: >
      sh -c "
        echo '🔍 [Scan Frontend] Проверка целостности зависимостей...';
        if [ ! -f node_modules/.bin/vite ]; then
          echo '🚨 ПАКЕТЫ ПОВРЕЖДЕНЫ ИЛИ ОТСУТСТВУЮТ! Восстановление контура...';
          npm install --prefer-offline --no-audit --no-fund;
        fi;
        npm run dev -- --host --logLevel silent
      "

  # 5. Шлюз Nginx (Глушим логи доступа, оставляем только критические ошибки)
  nginx:
    image: nginx:alpine
    container_name: aura7_nginx_gateway
    ports:
      - "47788:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ../../:/app
    command: /bin/sh -c "nginx -g 'daemon off; error_log /dev/stderr error;'"
    networks:
      - aura7_network
    depends_on:
      - weaver_backend
      - frontend

  # 🚀 6. ИНТЕЛЛЕКТУАЛЬНЫЙ ТЕРМИНАЛ ПРОГРЕССА ГОТОВНОСТИ (С ЗАЩИТОЙ ОТ ЗАВИСАНИЯ)
  readiness_checker:
    image: alpine:latest
    container_name: aura7_readiness_checker
    networks:
      - aura7_network
    depends_on:
      - memgraph
      - nginx
      - frontend
    command: >
      sh -c "
        while ! mknod /tmp/pipe p 2>/dev/null; do sleep 0.1; done;
        echo '🚀 [ 0%] Запуск сканирования... Ожидание готовности сетевой матрицы Аура 7...';
        
        # Безопасный опрос Memgraph (макс. 40 попыток ~20 секунд)
        TRY=0; until nc -w 1 memgraph 7687 2>/dev/null || [ \$TRY -eq 40 ]; do sleep 0.5; TRY=\$((TRY+1)); done;
        if [ \$TRY -eq 40 ]; then echo '🚨 КРИТИЧЕСКИЙ СБОЙ: Memgraph не ответил!'; exit 1; fi;
        echo '📡 [ 25%] ГРАФОВАЯ СУБД МЕMGRAPH УСПЕШНО ОТКРЫЛА ПОРТ 7687!';
        
        # Безопасный опрос Frontend (макс. 120 попыток ~60 секунд)
        TRY=0; until nc -w 1 frontend 3000 2>/dev/null || [ \$TRY -eq 120 ]; do sleep 0.5; TRY=\$((TRY+1)); done;
        if [ \$TRY -eq 120 ]; then echo '🚨 КРИТИЧЕСКИЙ СБОЙ: Frontend не запустился!'; exit 1; fi;
        echo '🪐 [ 50%] REACTFLOW-ФРОНТЕНД СТАБИЛИЗИРОВАЛ СЕТЕВОЙ ПОРТ 3000!';
        
        # Безопасный опрос Nginx (макс. 40 попыток ~20 секунд)
        TRY=0; until nc -w 1 nginx 80 2>/dev/null || [ \$TRY -eq 40 ]; do sleep 0.5; TRY=\$((TRY+1)); done;
        if [ \$TRY -eq 40 ]; then echo '🚨 КРИТИЧЕСКИЙ СБОЙ: Шлюз Nginx недоступен!'; exit 1; fi;
        echo '⚡ [ 75%] ШЛЮЗ NGINX УСПЕШНО СМАРШРУТИЗИРОВАЛ ВНЕШНИЙ ПОРТ 80!';
        
        sleep 1;
        echo '=========================================================';
        echo '🔥 [100%] [SPEEDRUN READY] КОНТУР УСПЕШНО ИГГДРАСИЛЬ-СТАБИЛИЗИРОВАН!';
        echo '🚀 ВСЕ СЕРВИСЫ ОК. СКОБКИ СОШЛИСЬ. ПУЛЯЙ ТРАНСПОРТ 13 РАКУШЕК!';
        echo '=========================================================';
      "

volumes:
  aura7_mg_data:

networks:
  aura7_network:
    driver: bridge