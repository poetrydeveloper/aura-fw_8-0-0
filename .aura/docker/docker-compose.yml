name: aura-7

services:
  # 1. Графовая база данных Memgraph
  memgraph:
    image: memgraph/memgraph:3.12.0-relwithdebinfo-malloc
    container_name: aura7_memgraph
    networks:
      - aura7_network
    logging:
      driver: "json-file"
      options:
        max-size: "10m"

  # 2. UI-интерфейс управления Memgraph Lab (Напрямую на порт 3001)
  memgraph_lab:
    image: memgraph/lab:latest
    container_name: aura7_memgraph_lab
    ports:
      - "3001:3000"
    environment:
      - QUICK_CONNECT_HOST=memgraph
      - QUICK_CONNECT_PORT=7687
    networks:
      - aura7_network
    depends_on:
      - memgraph

  # 3. Бэкенд Ткача (Express API + Детерминированный кодогенератор)
  weaver_backend:
    image: node:20-alpine
    container_name: aura7_weaver_backend
    working_dir: /app
    volumes:
      # ХИРУРГИЧЕСКИЙ ФИКС ДЛЯ WINDOWS: Жестко указываем Docker подняться на 2 папки вверх до корня AURA_5
      - ../../:/app
      # Изолируем node_modules контейнера, чтобы сборка шла внутри Linux-окружения
      - /app/.aura/services/core/node_modules
    networks:
      - aura7_network
    depends_on:
      - memgraph
    # Бронированная команда запуска: выводим текущую папку для дебага, заходим и собираем
    command: sh -c "echo 'Текущие файлы в /app:' && ls -la /app && cd /app/.aura/services/core && npm install && mkdir -p dist && npx tsc && node dist/index.js"

  # 4. Шлюз Nginx (Маршрутизатор API пакетов на порт 7788)
  nginx:
    image: nginx:alpine
    container_name: aura7_nginx_gateway
    ports:
      - "7788:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    networks:
      - aura7_network
    depends_on:
      - weaver_backend

volumes:
  aura7_mg_data:

networks:
  aura7_network:
    driver: bridge
